<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>掛號統計資訊 - MiniClinic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .stats-card { transition: transform 0.2s; }
        .stats-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-graph-up"></i> 診所營運統計</h1>
        <a href="/" class="btn btn-outline-secondary">回首頁</a>
    </div>

    <!-- 總數區塊 -->
    <div class="row mb-5 text-center">
        <div class="col-md-4">
            <div class="card stats-card border-primary shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-primary">醫師總數</h5>
                    <p class="card-text display-4 fw-bold" th:text="${doctorCount}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stats-card border-success shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-success">病患總數</h5>
                    <p class="card-text display-4 fw-bold" th:text="${patientCount}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stats-card border-info shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-info">掛號總數</h5>
                    <p class="card-text display-4 fw-bold" th:text="${appointmentCount}">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 科別分組區塊 -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">各科別掛號分佈</div>
        <div class="card-body">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>科別</th>
                        <th>掛號人次</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${statsByDept}">
                        <td th:text="${entry.key}" class="fw-bold">科別名稱</td>
                        <td>
                            <span class="badge bg-secondary fs-6" th:text="${entry.value}">0</span>
                        </td>
                    </tr>
                    <tr th:if="${#maps.isEmpty(statsByDept)}">
                        <td colspan="2" class="text-center text-muted">目前尚無掛號資料</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
